name: Website quality checks

on:
  push:
    branches:
      - main
      - "enhancement/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run static quality checks
        run: npm test
      - name: Validate D1 migrations and seed inventory
        run: python3 tests/check-cms-migrations.py
