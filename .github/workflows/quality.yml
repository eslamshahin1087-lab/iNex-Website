name: Website quality checks

on:
  push:
    branches:
      - main
      - "enhancement/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run static quality checks
        run: npm test
